<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="background:#0a0e0a;color:#00ff66;font-family:monospace;padding:16px;">
    <h2>Deals Bridge - Invoke Methods</h2>
    <button onclick="invokeBridge('goBack')">Go Back</button>
    <button onclick="invokeBridge('initEsimFlowActivation')">Init eSIM</button>
    <button onclick="invokeBridge('shareQrCode')">Share QR</button>
    <button onclick="invokeBridge('redirectToCart')">Go to Cart</button>
    <pre id="status">Ready...</pre>

    <script>
        function invokeBridge(method) {
            const status = document.getElementById('status');
            
            if (typeof deals === 'undefined' || deals === null) {
                status.textContent = '❌ Bridge not available';
                return;
            }
            
            if (typeof deals[method] !== 'function') {
                status.textContent = `❌ Method "${method}" not found or not a function`;
                return;
            }
            
            try {
                deals[method]();
                status.textContent = `✅ Called: ${method}`;
                console.log(`Bridge method "${method}" invoked successfully`);
            } catch (error) {
                status.textContent = `❌ Error calling ${method}: ${error.message}`;
            }
        }
        
        // Check bridge availability on load
        window.onload = function() {
            if (typeof deals !== 'undefined' && deals !== null) {
                document.getElementById('status').textContent = '✅ Bridge available';
            } else {
                document.getElementById('status').textContent = '⏳ Waiting for bridge...';
            }
        };
    </script>
</body>
</html>
